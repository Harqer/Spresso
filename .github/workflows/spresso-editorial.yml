name: Spresso Editorial Blog

on:
  push:
    branches: [main]
    paths:
      - 'marketing/posts/**'
      - 'marketing/pipeline.py'
      - 'marketing/tests/**'
      - '.github/workflows/spresso-editorial.yml'
  schedule:
    - cron: '17 10 * * 1,3,5'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spresso-editorial-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s marketing/tests -v
      - name: Build approved blog posts
        run: python marketing/pipeline.py build
        env:
          SPRESSO_BLOG_BASE_URL: ${{ vars.SPRESSO_BLOG_BASE_URL || 'https://harqer.github.io/Spresso/' }}
      - name: Export social draft queue (no automatic posting)
        run: python marketing/pipeline.py queue
        env:
          SPRESSO_BLOG_BASE_URL: ${{ vars.SPRESSO_BLOG_BASE_URL || 'https://harqer.github.io/Spresso/' }}
      - name: Upload social drafts for human review
        uses: actions/upload-artifact@v4
        with:
          name: spresso-social-drafts
          path: marketing/outbox/
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: marketing/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved stories to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
